<div class="contenedor">

  <div class="panel-header">
    <h2>
      Notificaciones
      <mat-icon [matBadge]="pendientes > 0 ? pendientes : null" matBadgeColor="warn">notifications</mat-icon>
    </h2>
    <button mat-stroked-button (click)="marcarTodasLeidas()" [disabled]="pendientes === 0">
      Marcar todas como leídas
    </button>
  </div>

  <mat-list>
    <mat-list-item *ngFor="let n of notificaciones" [class.no-leida]="!n.leida">
      <span matListItemTitle>{{ n.tipo }}</span>
      <span matListItemLine>{{ n.mensaje }}</span>
      <span matListItemLine class="fecha">{{ n.fecha | date:'dd/MM/yyyy HH:mm' }}</span>
    </mat-list-item>
  </mat-list>

  <p *ngIf="notificaciones.length === 0" class="sin-resultados">No tienes notificaciones.</p>

</div>
