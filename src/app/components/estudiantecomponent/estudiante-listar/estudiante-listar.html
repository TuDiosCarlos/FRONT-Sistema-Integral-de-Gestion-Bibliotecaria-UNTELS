<div class="contenedor">
  <div class="listar-header">
    <div>
      <h2>Padrón de Estudiantes</h2>
      <span>Total: {{ estudiantes.length }} estudiantes</span>
    </div>
    <button mat-raised-button color="primary" routerLink="/estudiantes/nuevo">
      <mat-icon>person_add</mat-icon>
      Nuevo estudiante
    </button>
  </div>

  <table mat-table [dataSource]="estudiantes" class="mat-elevation-z2 tabla-estudiantes">

    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef>Código</th>
      <td mat-cell *matCellDef="let e">{{ e.codigo }}</td>
    </ng-container>

    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let e">{{ e.nombre }}</td>
    </ng-container>

    <ng-container matColumnDef="dni">
      <th mat-header-cell *matHeaderCellDef>DNI</th>
      <td mat-cell *matCellDef="let e">{{ e.dni }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let e">{{ e.email }}</td>
    </ng-container>

    <ng-container matColumnDef="carrera">
      <th mat-header-cell *matHeaderCellDef>Carrera</th>
      <td mat-cell *matCellDef="let e">{{ e.carrera || '-' }}</td>
    </ng-container>

    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let e">
        <mat-chip [color]="e.estado === 'ACTIVO' ? 'primary' : 'warn'" selected>
          {{ e.estado }}
        </mat-chip>
      </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let e">
        <button mat-icon-button color="primary"
                (click)="editarEstudiante(e.idUsuario)"
                matTooltip="Editar">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button
                [color]="e.estado === 'ACTIVO' ? 'warn' : 'primary'"
                (click)="toggleEstado(e)"
                [matTooltip]="e.estado === 'ACTIVO' ? 'Desactivar estudiante' : 'Activar estudiante'">
          <mat-icon>{{ e.estado === 'ACTIVO' ? 'block' : 'check_circle' }}</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
  </table>
</div>
