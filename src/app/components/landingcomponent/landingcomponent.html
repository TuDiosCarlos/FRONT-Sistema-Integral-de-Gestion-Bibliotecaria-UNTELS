<nav class="navbar">
  <div class="nav-container">
    <a class="nav-brand" routerLink="/">
      <span class="brand-icon">&#x1F4DA;</span>
      <span class="brand-text">SIGBAU</span>
    </a>
    <div class="nav-links">
      <a routerLink="/" class="nav-link active">Inicio</a>
      <a routerLink="/login" class="btn-login">Iniciar Sesión</a>
    </div>
  </div>
</nav>

<section class="team team-unica">
  <div class="team-container">
    <h2>Nuestro Equipo</h2>
    <p class="team-subtitle">Conoce a los profesionales que hicieron posible este proyecto</p>
    <div class="team-grid">
      <div class="team-card" *ngFor="let integrante of integrantes">
        <div class="team-image">
          <img [src]="integrante.imagen" [alt]="integrante.nombre" loading="lazy" />
        </div>
        <div class="team-info">
          <h3>{{ integrante.nombre }}</h3>
          <p>{{ integrante.rol }}</p>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="footer-content">

  </div>
</footer>
