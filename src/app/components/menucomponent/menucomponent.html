<nav class="menu-lateral">
  <div class="menu-marca">
    <mat-icon>local_library</mat-icon>
    <span>Biblioteca UNTELS</span>
  </div>

  <div class="menu-usuario" *ngIf="nombreUsuario">
    <mat-icon>account_circle</mat-icon>
    <div class="menu-usuario-info">
      <strong>{{ nombreUsuario }}</strong>
      <small>{{ rolUsuario }}</small>
    </div>
    <app-notificacion-panel></app-notificacion-panel>
  </div>

  <mat-nav-list class="menu-items">
    <a
      mat-list-item
      *ngFor="let item of itemsVisibles"
      [routerLink]="item.ruta"
      routerLinkActive="menu-item-activo"
    >
      <mat-icon matListItemIcon>{{ item.icono }}</mat-icon>
      <span matListItemTitle>{{ item.etiqueta }}</span>
    </a>
  </mat-nav-list>

  <button class="menu-cerrar-sesion" (click)="cerrarSesion()" matTooltip="Cerrar sesión">
    <mat-icon>logout</mat-icon>
    <span>Cerrar sesión</span>
  </button>
</nav>
