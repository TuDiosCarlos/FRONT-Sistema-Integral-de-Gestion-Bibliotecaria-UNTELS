<div class="vigentes-container">
  <h2>Préstamos Vigentes</h2>
  <p>Libros actualmente en préstamo.</p>

  <div *ngIf="listaVigentes.length === 0" class="sin-datos">
    <p>No hay préstamos vigentes en este momento.</p>
  </div>

  <table mat-table [dataSource]="listaVigentes" class="mat-elevation-z8" *ngIf="listaVigentes.length > 0">

    <ng-container matColumnDef="idLibro">
      <th mat-header-cell *matHeaderCellDef> ID Libro </th>
      <td mat-cell *matCellDef="let element"> {{ element.idLibro }} </td>
    </ng-container>

    <ng-container matColumnDef="idEstudiante">
      <th mat-header-cell *matHeaderCellDef> Estudiante </th>
      <td mat-cell *matCellDef="let element"> {{ element.idEstudiante }} </td>
    </ng-container>

    <ng-container matColumnDef="fechaEntrega">
      <th mat-header-cell *matHeaderCellDef> Fecha Devolución </th>
      <td mat-cell *matCellDef="let element"> {{ element.fechaEntrega | date:'dd/MM/yyyy' }} </td>
    </ng-container>

    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef> Estado </th>
      <td mat-cell *matCellDef="let element">
        <span class="badge-activo">{{ element.estado }}</span>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnasMostradas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnasMostradas;"></tr>
  </table>
</div>
