<div class="home-shell">
  <div class="home-header">
    <div>
      <p class="subtitle">Bienvenido, {{ nombreUsuario || 'usuario' }} · {{ rolUsuario }}</p>
      <h2>Panel de control</h2>
    </div>
    <button class="btn-primary" (click)="actualizar()" [disabled]="cargando">
      {{ cargando ? 'Actualizando...' : 'Actualizar datos' }}
    </button>
  </div>

  <div class="dashboard-grid">
    <div class="dashboard-card" *ngFor="let tarjeta of tarjetas" [ngClass]="tarjeta.clase">
      <span class="card-label">{{ tarjeta.etiqueta }}</span>
      <strong>{{ cargando ? '—' : tarjeta.valor }}</strong>
      <p>{{ tarjeta.descripcion }}</p>
    </div>
  </div>
</div>
