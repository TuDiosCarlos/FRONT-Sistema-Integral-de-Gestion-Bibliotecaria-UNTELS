<div class="contenedor">

  <div class="listar-header">
    <h2>Sanciones</h2>
  </div>

  <div class="filtros">
    <mat-form-field appearance="outline">
      <mat-label>Estado</mat-label>
      <mat-select [(ngModel)]="filtroEstado" (selectionChange)="filtrarPorEstado()">
        <mat-option *ngFor="let e of estados" [value]="e">{{ e }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <table mat-table [dataSource]="sanciones" class="mat-elevation-z2 tabla-sanciones">

    <ng-container matColumnDef="idEstudiante">
      <th mat-header-cell *matHeaderCellDef>ID Estudiante</th>
      <td mat-cell *matCellDef="let s">{{ s.idEstudiante }}</td>
    </ng-container>

    <ng-container matColumnDef="motivo">
      <th mat-header-cell *matHeaderCellDef>Motivo</th>
      <td mat-cell *matCellDef="let s">{{ s.motivo }}</td>
    </ng-container>

    <ng-container matColumnDef="diasSuspension">
      <th mat-header-cell *matHeaderCellDef>Días de suspensión</th>
      <td mat-cell *matCellDef="let s">{{ s.diasSuspension }}</td>
    </ng-container>

    <ng-container matColumnDef="multa">
      <th mat-header-cell *matHeaderCellDef>Multa</th>
      <td mat-cell *matCellDef="let s">S/ {{ s.multa | number:'1.2-2' }}</td>
    </ng-container>

    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let s">
        <mat-chip [color]="s.estado === 'activa' ? 'warn' : 'primary'" selected>{{ s.estado }}</mat-chip>
      </td>
    </ng-container>

    <ng-container matColumnDef="fechaFin">
      <th mat-header-cell *matHeaderCellDef>Fecha fin</th>
      <td mat-cell *matCellDef="let s">{{ s.fechaFin | date:'dd/MM/yyyy' }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let s">
        <button mat-raised-button color="primary" *ngIf="s.estado === 'activa'" (click)="cumplir(s)">
          <mat-icon>check</mat-icon> Marcar cumplida
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas;"></tr>

  </table>

  <p *ngIf="sanciones.length === 0" class="sin-resultados">No se encontraron sanciones.</p>

</div>
