<div class="configuracion-shell">
  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div class="configuracion-header">
      <div>
        <h2>Configuración del Sistema</h2>
        <p>Ajusta los parámetros generales del sistema bibliotecario.</p>
      </div>
      <button type="submit" class="btn-primary" [disabled]="form.invalid">Guardar cambios</button>
    </div>

    <div class="configuracion-card">
      <div class="config-row">
        <label>Días máximos de préstamo</label>
        <input type="number" formControlName="diasMaxPrestamo" placeholder="Ej. 15" />
      </div>
      <div class="config-row">
        <label>Límite de préstamos por estudiante</label>
        <input type="number" formControlName="limitePrestamos" placeholder="Ej. 3" />
      </div>
      <div class="config-row">
        <label>Monto de multa por día</label>
        <input type="number" formControlName="multaPorDia" placeholder="Ej. 5" />
      </div>
      <div class="config-row config-row-wide">
        <label>Scheduler automático diario</label>
        <select formControlName="schedulerActivo">
          <option [ngValue]="true">Activado</option>
          <option [ngValue]="false">Desactivado</option>
        </select>
      </div>
      <div class="config-row config-row-wide">
        <label>Notificaciones por email</label>
        <select formControlName="notifEmail">
          <option [ngValue]="true">Activadas</option>
          <option [ngValue]="false">Desactivadas</option>
        </select>
      </div>
      <div class="config-row config-row-wide">
        <label>Alerta de stock crítico (≤ 2 ejemplares)</label>
        <select formControlName="alertaStock">
          <option [ngValue]="true">Activada</option>
          <option [ngValue]="false">Desactivada</option>
        </select>
      </div>
      <div class="config-row config-row-wide">
        <label>Modo mantenimiento</label>
        <select formControlName="modoMant">
          <option [ngValue]="true">Activado</option>
          <option [ngValue]="false">Desactivado</option>
        </select>
      </div>
    </div>
  </form>
</div>
