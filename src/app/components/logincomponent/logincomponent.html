<div class="login-shell">
  <mat-card class="login-card">
    <div class="login-marca">
      <mat-icon>local_library</mat-icon>
      <h1>Biblioteca UNTELS</h1>
      <p>Ingresa tus credenciales para continuar</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="ingresar()" class="login-form">
      <div class="login-error" *ngIf="errorMensaje">
        <mat-icon>error_outline</mat-icon>
        <span>{{ errorMensaje }}</span>
      </div>

      <mat-form-field appearance="outline">
        <mat-label>Usuario</mat-label>
        <input matInput formControlName="username" autocomplete="username" />
        <mat-icon matPrefix>person</mat-icon>
        <mat-error *ngIf="username?.hasError('required')">El usuario es requerido</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Contraseña</mat-label>
        <input
          matInput
          [type]="ocultarPassword ? 'password' : 'text'"
          formControlName="password"
          autocomplete="current-password"
        />
        <mat-icon matPrefix>lock</mat-icon>
        <button
          type="button"
          mat-icon-button
          matSuffix
          (click)="ocultarPassword = !ocultarPassword"
          [attr.aria-label]="'Ocultar contraseña'"
          [attr.aria-pressed]="ocultarPassword"
        >
          <mat-icon>{{ ocultarPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="password?.hasError('required')">La contraseña es requerida</mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" class="login-boton" [disabled]="cargando">
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </mat-card>
</div>
