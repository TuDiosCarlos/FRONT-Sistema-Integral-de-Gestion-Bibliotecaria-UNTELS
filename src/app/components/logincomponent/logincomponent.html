<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Sistema Integral de Gestión Bibliotecaria</mat-card-title>
      <mat-card-subtitle>Inicia sesión para continuar</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="ingresar()">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="username" autocomplete="username">
          <mat-error *ngIf="form.get('username')?.hasError('required')">El usuario es obligatorio</mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password">
          <mat-error *ngIf="form.get('password')?.hasError('required')">La contraseña es obligatoria</mat-error>
        </mat-form-field>

        <p class="mensaje-error" *ngIf="mensajeError">{{ mensajeError }}</p>

        <button mat-raised-button color="primary" class="full-width" type="submit" [disabled]="cargando">
          Iniciar sesión
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
