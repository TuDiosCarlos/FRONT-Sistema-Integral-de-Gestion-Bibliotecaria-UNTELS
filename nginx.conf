server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.csr.html;

    # Compresión básica para assets estáticos
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cachear los assets con hash en el nombre (main-XXXX.js, styles-XXXX.css, etc.)
    location ~* \.(?:js|css|svg|jpg|jpeg|png|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Fallback SPA: cualquier ruta que no sea un archivo real cae en index.csr.html,
    # replicando el comportamiento de public/_redirects usado en Netlify
    # ("/*    /index.csr.html   200").
    location / {
        try_files $uri $uri/ /index.csr.html;
    }
}
